server:
  port: 8080

spring:
  application:
    name: flowable-app
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}
  h2:
    console:
      enabled: false

flowable:
  rest:
    enabled: true
  database:
    schema-update: true
  event-reregister: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
