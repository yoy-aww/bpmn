server:
  port: 8080

spring:
  application:
    name: flowable-app
  datasource:
    url: ${DB_URL:jdbc:h2:mem:flowable;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console

flowable:
  rest:
    enabled: true
  database:
    schema-update: true
  # 禁用事件重注册（避免启动慢）
  event-reregister: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flowable: INFO
    root: INFO
